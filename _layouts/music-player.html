<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<style>
  :root { --bg: #ffffff; --text: #1f2328; --quiet: #59636e; --link: #0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --text: #e6edf3; --quiet: #9198a1; --link: #4493f8; } }
  html { background: var(--bg); color: var(--text); }
  body { margin: 0 auto; max-width: 42rem; padding: 2rem 1rem 4rem;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 .5rem; }
  h2 { font-size: 1.2rem; margin: 2rem 0 .5rem; }
  em { color: var(--quiet); font-style: normal; }
  a { color: var(--link); overflow-wrap: anywhere; }
  li { margin-bottom: .4rem; }
  .app { color: var(--quiet); font-size: .95rem; margin-bottom: 1.5rem; }
</style>
</head>
<body>
<div class="app">Music Player: MP3 &amp; Visualizer · <a href="privacy">Privacy policy</a> · <a href="terms">Terms of use</a></div>
{{ content }}
</body>
</html>
